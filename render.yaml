services:
  - type: web
    name: hlelofx
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: HLELOFX_OWNER_EMAIL
        value: hlelomabuza@icloud.com
      - key: HLELOFX_OWNER_PASSWORD
        sync: false
      - key: HLELOFX_SECRET_KEY
        generateValue: true
